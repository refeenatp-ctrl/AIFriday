<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylesheet containing styling definitions -->
  <style>
    .bg { fill: #080a10; }
    .grid { stroke: rgba(18, 24, 45, 0.4); stroke-width: 1; }
    
    /* Box Styles */
    .layer-box { fill: rgba(13, 17, 30, 0.85); stroke: rgba(255, 255, 255, 0.08); stroke-width: 1.5; rx: 12px; }
    .card-fe { fill: rgba(18, 25, 45, 0.6); stroke: rgba(0, 242, 254, 0.2); stroke-width: 1.2; rx: 8px; }
    .card-gw { fill: rgba(24, 18, 25, 0.6); stroke: rgba(255, 88, 88, 0.2); stroke-width: 1.2; rx: 8px; }
    .card-db { fill: rgba(24, 18, 30, 0.6); stroke: rgba(248, 87, 166, 0.2); stroke-width: 1.2; rx: 8px; }
    .card-bk { fill: rgba(15, 27, 23, 0.6); stroke: rgba(56, 239, 125, 0.2); stroke-width: 1.2; rx: 8px; }
    .card-ag { fill: rgba(24, 21, 40, 0.6); stroke: rgba(167, 139, 250, 0.2); stroke-width: 1.2; rx: 8px; }
    .card-mcp { fill: rgba(15, 25, 35, 0.6); stroke: rgba(0, 188, 212, 0.2); stroke-width: 1.2; rx: 8px; }
    
    /* Label Styles */
    .title-main { font-family: 'Outfit', sans-serif; font-size: 24px; fill: #ffffff; font-weight: bold; }
    .subtitle-main { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; fill: #8c9ba5; }
    .layer-title { font-family: 'Outfit', sans-serif; font-size: 14px; fill: #ffffff; font-weight: bold; letter-spacing: 0.5px; }
    .box-title-internal { font-family: 'Outfit', sans-serif; font-size: 12px; fill: #ffffff; font-weight: bold; letter-spacing: 0.5px; }
    .badge-text { font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: bold; letter-spacing: 0.5px; }
    .node-text { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; fill: #e2e8f0; font-weight: 600; }
    .node-desc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; fill: #8c9ba5; }
    
    /* Connection Lines */
    .flow-line { fill: none; stroke-width: 2; stroke-linecap: round; }
    .flow-line-gw { stroke: #ff5858; }
    .flow-line-db { stroke: #f857a6; }
    .flow-line-ag { stroke: #a78bfa; }
    .flow-line-mcp { stroke: #00bcd4; }
  </style>

  <!-- BACKGROUND -->
  <rect width="1200" height="800" class="bg" />
  
  <!-- GRID PATTERN -->
  <g>
    <!-- Horizontal lines -->
    <line x1="0" y1="50" x2="1200" y2="50" class="grid" />
    <line x1="0" y1="100" x2="1200" y2="100" class="grid" />
    <line x1="0" y1="150" x2="1200" y2="150" class="grid" />
    <line x1="0" y1="200" x2="1200" y2="200" class="grid" />
    <line x1="0" y1="250" x2="1200" y2="250" class="grid" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid" />
    <line x1="0" y1="400" x2="1200" y2="400" class="grid" />
    <line x1="0" y1="450" x2="1200" y2="450" class="grid" />
    <line x1="0" y1="500" x2="1200" y2="500" class="grid" />
    <line x1="0" y1="550" x2="1200" y2="550" class="grid" />
    <line x1="0" y1="600" x2="1200" y2="600" class="grid" />
    <line x1="0" y1="650" x2="1200" y2="650" class="grid" />
    <line x1="0" y1="700" x2="1200" y2="700" class="grid" />
    <line x1="0" y1="750" x2="1200" y2="750" class="grid" />
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="800" class="grid" />
    <line x1="200" y1="0" x2="200" y2="800" class="grid" />
    <line x1="300" y1="0" x2="300" y2="800" class="grid" />
    <line x1="400" y1="0" x2="400" y2="800" class="grid" />
    <line x1="500" y1="0" x2="500" y2="800" class="grid" />
    <line x1="600" y1="0" x2="600" y2="800" class="grid" />
    <line x1="700" y1="0" x2="700" y2="800" class="grid" />
    <line x1="800" y1="0" x2="800" y2="800" class="grid" />
    <line x1="900" y1="0" x2="900" y2="800" class="grid" />
    <line x1="1000" y1="0" x2="1000" y2="800" class="grid" />
    <line x1="1100" y1="0" x2="1100" y2="800" class="grid" />
  </g>

  <!-- TITLE BLOCK -->
  <g transform="translate(50, 45)">
    <text x="0" y="0" class="title-main">Enterprise GenAI Agent Architecture</text>
    <text x="0" y="20" class="subtitle-main">Multi-Agent Orchestration &amp; Integration Framework</text>
  </g>

  <!-- ==================== CONNECTION LINES (BACKGROUND) ==================== -->
  <!-- Gateway & DB to Backend -->
  <path d="M 250 330 H 265 V 330 H 280" class="flow-line flow-line-gw" />
  <path d="M 280 340 H 265 V 340 H 250" class="flow-line flow-line-gw" />
  
  <path d="M 250 470 H 265 V 470 H 280" class="flow-line flow-line-db" />
  <path d="M 280 480 H 265 V 480 H 250" class="flow-line flow-line-db" />
  
  <!-- Gateway & DB to Notification Job -->
  <path d="M 135 385 V 470 V 560" class="flow-line flow-line-gw" />
  <path d="M 145 560 V 470 V 385" class="flow-line flow-line-gw" />
  
  <path d="M 195 515 V 560" class="flow-line flow-line-db" />
  <path d="M 205 560 V 515" class="flow-line flow-line-db" />
  
  <!-- Backend to MCP Server -->
  <path d="M 830 520 V 585 V 650" class="flow-line flow-line-ag" />
  <path d="M 840 650 V 585 V 830" class="flow-line flow-line-ag" style="stroke: #00bcd4;" />
  
  <!-- MCP Server to MCP DB -->
  <path d="M 970 690 H 1010 H 1050" class="flow-line flow-line-mcp" />
  <path d="M 1050 700 H 1010 H 970" class="flow-line flow-line-mcp" />


  <!-- ==================== LAYER 1: FRONTEND ==================== -->
  <g transform="translate(50, 95)">
    <!-- Layer Outer Border -->
    <rect width="1100" height="120" class="layer-box" style="stroke: rgba(0, 242, 254, 0.15); fill: rgba(0, 242, 254, 0.02);" />
    
    <!-- Layer Badge -->
    <rect x="20" y="15" width="120" height="20" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" rx="4" />
    <text x="80" y="29" fill="#00f2fe" class="badge-text" text-anchor="middle">PRESENTATION LAYER</text>
    <text x="160" y="30" class="layer-title">Front End (Angular Web App)</text>
    
    <!-- Module Cards -->
    <g transform="translate(20, 50)">
      <!-- Admin -->
      <g transform="translate(0, 0)">
        <rect width="140" height="50" class="card-fe" />
        <text x="70" y="30" class="node-text" text-anchor="middle">Admin</text>
      </g>
      <!-- Dashboard -->
      <g transform="translate(152, 0)">
        <rect width="140" height="50" class="card-fe" />
        <text x="70" y="30" class="node-text" text-anchor="middle">Dashboard</text>
      </g>
      <!-- Analysis -->
      <g transform="translate(304, 0)">
        <rect width="140" height="50" class="card-fe" />
        <text x="70" y="30" class="node-text" text-anchor="middle">Analysis</text>
      </g>
      <!-- Forecast -->
      <g transform="translate(456, 0)">
        <rect width="140" height="50" class="card-fe" />
        <text x="70" y="30" class="node-text" text-anchor="middle">Forecast</text>
      </g>
      <!-- Report -->
      <g transform="translate(608, 0)">
        <rect width="140" height="50" class="card-fe" />
        <text x="70" y="30" class="node-text" text-anchor="middle">Report</text>
      </g>
      <!-- Chat -->
      <g transform="translate(760, 0)">
        <rect width="140" height="50" class="card-fe" />
        <text x="70" y="30" class="node-text" text-anchor="middle">Chat</text>
      </g>
      <!-- Logs -->
      <g transform="translate(912, 0)">
        <rect width="140" height="50" class="card-fe" />
        <text x="70" y="30" class="node-text" text-anchor="middle">Logs</text>
      </g>
    </g>
  </g>


  <!-- ==================== MIDDLE ROW ==================== -->
  
  <!-- LEFT COLUMN: INTEGRATION & GATEWAY -->
  <g transform="translate(50, 240)">
    <!-- TCS GenAI Gateway -->
    <g id="svg-node-gateway" transform="translate(0, 0)">
      <rect width="200" height="145" class="layer-box" style="stroke: rgba(255, 88, 88, 0.25);" />
      <text x="15" y="30" class="layer-title" style="fill: #ff5858; font-size: 12px;">TCS GenAI Gateway</text>
      <rect x="15" y="50" width="170" height="75" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" rx="6" />
      <text x="25" y="72" class="node-desc" style="font-size: 9px;">Central API Gateway</text>
      <text x="25" y="90" class="node-desc" style="font-size: 9px;">OAuth JWT Security</text>
      <text x="25" y="108" class="node-desc" style="font-size: 9px;">Compliance Guard</text>
    </g>

    <!-- App DB (SQLite) -->
    <g id="svg-node-app-db" transform="translate(0, 165)">
      <rect width="200" height="110" class="layer-box" style="stroke: rgba(248, 87, 166, 0.25);" />
      <text x="15" y="30" class="layer-title" style="fill: #f857a6; font-size: 12px;">App DB (SQLite)</text>
      <rect x="15" y="45" width="170" height="50" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" rx="6" />
      <text x="25" y="62" class="node-desc" style="font-size: 9px;">Session Checkpoints</text>
      <text x="25" y="78" class="node-desc" style="font-size: 9px;">Audit logs &amp; queue</text>
    </g>

    <!-- Notification Job -->
    <g id="svg-node-notification" transform="translate(0, 295)">
      <rect width="200" height="85" class="layer-box" style="stroke: rgba(255, 255, 255, 0.08);" />
      <text x="15" y="30" class="layer-title" style="fill: #e2e8f0; font-size: 12px;">Notification Job</text>
      <text x="20" y="55" class="node-desc" style="font-size: 9px;">Async alerts worker.</text>
      <text x="20" y="70" class="node-desc" style="font-size: 9px;">Pulls DB queues.</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: BACKEND (PYTHON FLASK) -->
  <g transform="translate(270, 240)">
    <rect width="880" height="380" class="layer-box" style="stroke: rgba(56, 239, 125, 0.2); fill: rgba(56, 239, 125, 0.015);" />
    
    <!-- Layer Badge -->
    <rect x="20" y="15" width="100" height="20" fill="rgba(56, 239, 125, 0.1)" stroke="rgba(56, 239, 125, 0.3)" rx="4" />
    <text x="70" y="29" fill="#38ef7d" class="badge-text" text-anchor="middle">SERVER LAYER</text>
    <text x="140" y="30" class="layer-title">Backend (Python Flask Framework)</text>

    <!-- GUARDRAILS BOX -->
    <g transform="translate(20, 50)">
      <rect width="840" height="75" class="layer-box" style="stroke: rgba(56, 239, 125, 0.15); fill: rgba(15, 27, 23, 0.7);" />
      <text x="20" y="25" class="box-title-internal" style="fill: #38ef7d;">GUARDRAILS LAYER</text>
      
      <!-- Guardrail tag blocks -->
      <g transform="translate(25, 38)">
        <rect width="230" height="25" fill="rgba(248, 113, 113, 0.05)" stroke="rgba(248, 113, 113, 0.2)" rx="4" />
        <text x="115" y="15" fill="#f87171" class="node-text" text-anchor="middle">Threat Detection</text>
      </g>
      <g transform="translate(285, 38)">
        <rect width="230" height="25" fill="rgba(96, 165, 250, 0.05)" stroke="rgba(96, 165, 250, 0.2)" rx="4" />
        <text x="115" y="15" fill="#60a5fa" class="node-text" text-anchor="middle">GDPR Compliance</text>
      </g>
      <g transform="translate(545, 38)">
        <rect width="230" height="25" fill="rgba(251, 191, 36, 0.05)" stroke="rgba(251, 191, 36, 0.2)" rx="4" />
        <text x="115" y="15" fill="#fbbf24" class="node-text" text-anchor="middle">PII Masking</text>
      </g>
    </g>

    <!-- AGENT LAYER (LANGRAPH) -->
    <g transform="translate(20, 140)">
      <rect width="840" height="220" class="layer-box" style="stroke: rgba(167, 139, 250, 0.2); fill: rgba(167, 139, 250, 0.03);" />
      <text x="20" y="25" class="box-title-internal" style="fill: #a78bfa;">Agent Layer (LangGraph)</text>
      
      <!-- Orchestrator row -->
      <g transform="translate(20, 40)">
        <rect width="230" height="35" class="card-ag" />
        <text x="115" y="22" class="node-text" text-anchor="middle">Planner</text>
      </g>
      <g transform="translate(270, 40)">
        <rect width="300" height="35" class="card-ag" style="stroke: #a78bfa;" />
        <text x="150" y="22" class="node-text" text-anchor="middle">Supervisor (Orchestrator)</text>
      </g>
      <g transform="translate(590, 40)">
        <rect width="230" height="35" class="card-ag" />
        <text x="115" y="22" class="node-text" text-anchor="middle">RAG Engine</text>
      </g>

      <!-- Domain Agents -->
      <g transform="translate(20, 90)">
        <rect width="800" height="65" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.03)" rx="6" />
        <text x="15" y="20" class="node-desc" style="font-weight: bold;">Domain Agents</text>
        <g transform="translate(130, 10)">
          <!-- Finance -->
          <g transform="translate(0, 0)">
            <rect width="130" height="40" class="card-ag" />
            <text x="65" y="25" class="node-text" text-anchor="middle">Finance</text>
          </g>
          <!-- Operations -->
          <g transform="translate(142, 0)">
            <rect width="130" height="40" class="card-ag" />
            <text x="65" y="25" class="node-text" text-anchor="middle">Operations</text>
          </g>
          <!-- Support -->
          <g transform="translate(284, 0)">
            <rect width="130" height="40" class="card-ag" />
            <text x="65" y="25" class="node-text" text-anchor="middle">Support</text>
          </g>
          <!-- HR -->
          <g transform="translate(426, 0)">
            <rect width="130" height="40" class="card-ag" />
            <text x="65" y="25" class="node-text" text-anchor="middle">HR</text>
          </g>
        </g>
      </g>

      <!-- Helpers Row -->
      <g transform="translate(20, 170)">
        <g transform="translate(0, 0)">
          <rect width="185" height="35" class="card-ag" />
          <text x="92" y="22" class="node-text" text-anchor="middle">Reflection</text>
        </g>
        <g transform="translate(205, 0)">
          <rect width="185" height="35" class="card-ag" />
          <text x="92" y="22" class="node-text" text-anchor="middle">Memory</text>
        </g>
        <g transform="translate(410, 0)">
          <rect width="185" height="35" class="card-ag" />
          <text x="92" y="22" class="node-text" text-anchor="middle">Summarizer Agent</text>
        </g>
        <g transform="translate(615, 0)">
          <rect width="185" height="35" class="card-ag" style="stroke: #00bcd4;" />
          <text x="92" y="22" class="node-text" text-anchor="middle" style="fill: #00bcd4;">MCP Client</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== LAYER 3: MCP SERVER ==================== -->
  <g transform="translate(50, 635)">
    <!-- MCP Server Box -->
    <g transform="translate(0, 0)">
      <rect width="790" height="120" class="layer-box" style="stroke: rgba(0, 188, 212, 0.2); fill: rgba(0, 188, 212, 0.015);" />
      
      <!-- Layer Badge -->
      <rect x="20" y="15" width="130" height="20" fill="rgba(0, 188, 212, 0.1)" stroke="rgba(0, 188, 212, 0.3)" rx="4" />
      <text x="85" y="29" fill="#00bcd4" class="badge-text" text-anchor="middle">INTEGRATION LAYER</text>
      <text x="170" y="30" class="layer-title">Model Context Protocol (MCP) Server</text>
      
      <!-- Tools -->
      <g transform="translate(20, 50)">
        <g transform="translate(0, 0)">
          <rect width="140" height="50" class="card-mcp" />
          <text x="70" y="30" class="node-text" text-anchor="middle">Email Tool</text>
        </g>
        <g transform="translate(152, 0)">
          <rect width="140" height="50" class="card-mcp" />
          <text x="70" y="30" class="node-text" text-anchor="middle">Calendar Tool</text>
        </g>
        <g transform="translate(304, 0)">
          <rect width="140" height="50" class="card-mcp" />
          <text x="70" y="30" class="node-text" text-anchor="middle">File Access</text>
        </g>
        <g transform="translate(456, 0)">
          <rect width="140" height="50" class="card-mcp" />
          <text x="70" y="30" class="node-text" text-anchor="middle">Web Search</text>
        </g>
        <g transform="translate(608, 0)">
          <rect width="142" height="50" class="card-mcp" />
          <text x="71" y="30" class="node-text" text-anchor="middle">Custom ERP</text>
        </g>
      </g>
    </g>

    <!-- MCP SQLite DB -->
    <g transform="translate(820, 0)">
      <rect width="280" height="120" class="layer-box" style="stroke: rgba(0, 188, 212, 0.25);" />
      <text x="20" y="30" class="layer-title" style="fill: #00bcd4;">MCP DB (SQLite)</text>
      <rect x="20" y="45" width="240" height="55" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" rx="6" />
      <text x="35" y="68" class="node-desc">Tool registry configurations,</text>
      <text x="35" y="83" class="node-desc">execution schemas &amp; logs.</text>
    </g>
  </g>
</svg>
